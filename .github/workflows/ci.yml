name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Install dependencies
      run: go mod download
    
    - name: Verify dependencies
      run: go mod verify
    
    - name: Build
      run: go build -v ./...
    
    - name: Run go vet
      run: go vet ./...
    
    - name: Run go fmt
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted:"
          gofmt -s -l .
          exit 1
        fi
    
    - name: Test build script
      run: |
        chmod +x build.sh
        ./build.sh
    
    - name: Verify build artifacts
      run: |
        echo "Checking build artifacts..."
        ls -la dist/
        
        # Verify all expected files exist
        test -f dist/ai-cart-websocket-linux-amd64
        test -f dist/ai-cart-websocket-windows-amd64.exe
        test -f dist/ai-cart-websocket-darwin-amd64
        test -f dist/ai-cart-websocket-darwin-arm64
        test -f dist/checksums.txt
        
        echo "✅ All build artifacts created successfully"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ai-cart-websocket-binaries
        path: dist/*.tar.gz
        retention-days: 7
